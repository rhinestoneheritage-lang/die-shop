<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1428">
<title>DieTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
  /* Layout: sticky steel header and scrolling tab bar over one column of record cards on phones; two-column dashboard on wide screens. */
  :root{
    --bg:#ECEFF1;
    --surface:#FFFFFF;
    --surface-alt:#F5F7F8;
    --border:#D6DBDF;
    --ink:#1C2228;
    --ink-soft:#5A636B;
    --ink-faint:#868F96;
    --accent:#C9531A;
    --accent-dark:#A3410F;
    --accent-bg:#FBE7DB;
    --on-accent:#FFFFFF;
    --steel:#2F5870;
    --steel-bg:#E2EBF0;
    --green:#237A4B;
    --green-bg:#E0F1E8;
    --amber:#8F6208;
    --amber-bg:#FAEFD2;
    --red:#A83232;
    --red-bg:#F8E4E4;
    --gray:#6F6C5E;
    --gray-bg:#E8E8E2;
    --header-bg:#1C2228;
    --header-fg:#FFFFFF;
    --header-soft:#AEB6BD;
    --toast-bg:#1C2228;
    --toast-fg:#FFFFFF;
    --plate-hi:rgba(255,255,255,.55);
    --plate-lo:rgba(0,0,0,.07);
    --overlay:rgba(14,16,18,.55);
    --shadow-sm:0 1px 2px rgba(20,26,32,.08);
    --shadow-md:0 8px 24px rgba(20,26,32,.16);
    --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --font-display:'Oswald','Arial Narrow',Impact,sans-serif;
    --radius:5px;
    --header-h:60px;
    --tabs-h:48px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14171A;
      --surface:#1C2024;
      --surface-alt:#22272C;
      --border:#323941;
      --ink:#E8ECEF;
      --ink-soft:#A1A9B0;
      --ink-faint:#6E777E;
      --accent:#E8793F;
      --accent-dark:#F29463;
      --accent-bg:#3A2418;
      --on-accent:#1A0F08;
      --steel:#86B0C9;
      --steel-bg:#1E2F3A;
      --green:#62C48F;
      --green-bg:#1B2F25;
      --amber:#E3B556;
      --amber-bg:#352A10;
      --red:#EE8686;
      --red-bg:#3A2020;
      --gray:#ABA895;
      --gray-bg:#2D2D27;
      --header-bg:#0E1012;
      --header-fg:#FFFFFF;
      --header-soft:#9AA3AA;
      --toast-bg:#E8ECEF;
      --toast-fg:#14171A;
      --plate-hi:rgba(255,255,255,.07);
      --plate-lo:rgba(0,0,0,.25);
      --overlay:rgba(0,0,0,.65);
      --shadow-sm:0 1px 2px rgba(0,0,0,.4);
      --shadow-md:0 8px 24px rgba(0,0,0,.5);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14171A;
    --surface:#1C2024;
    --surface-alt:#22272C;
    --border:#323941;
    --ink:#E8ECEF;
    --ink-soft:#A1A9B0;
    --ink-faint:#6E777E;
    --accent:#E8793F;
    --accent-dark:#F29463;
    --accent-bg:#3A2418;
    --on-accent:#1A0F08;
    --steel:#86B0C9;
    --steel-bg:#1E2F3A;
    --green:#62C48F;
    --green-bg:#1B2F25;
    --amber:#E3B556;
    --amber-bg:#352A10;
    --red:#EE8686;
    --red-bg:#3A2020;
    --gray:#ABA895;
    --gray-bg:#2D2D27;
    --header-bg:#0E1012;
    --header-fg:#FFFFFF;
    --header-soft:#9AA3AA;
    --toast-bg:#E8ECEF;
    --toast-fg:#14171A;
    --plate-hi:rgba(255,255,255,.07);
    --plate-lo:rgba(0,0,0,.25);
    --overlay:rgba(0,0,0,.65);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 8px 24px rgba(0,0,0,.5);
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;-webkit-font-smoothing:antialiased;}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--header-bg);}
  button,input,select,textarea{font-family:var(--font-body);font-size:16px;color:inherit;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* ---------- Header ---------- */
  header.app-header{background:var(--header-bg);color:var(--header-fg);height:var(--header-h);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;box-shadow:var(--shadow-md);}
  .brand{display:flex;align-items:center;gap:9px;min-width:0;}
  .brand-mark{width:32px;height:32px;border-radius:4px;background:linear-gradient(145deg,#D4601F,#9C4313);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.25), inset 0 -2px 3px rgba(0,0,0,.35);flex-shrink:0;}
  .brand-mark svg{width:17px;height:17px;}
  .brand-text{min-width:0;}
  .brand-text .name{font-family:var(--font-display);font-size:18px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;line-height:1;white-space:nowrap;}
  .brand-text .tag{font-size:10.5px;color:var(--header-soft);letter-spacing:.02em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .today-pill{font-size:11.5px;font-weight:600;color:var(--header-fg);background:rgba(255,255,255,.1);padding:5px 10px;border-radius:20px;white-space:nowrap;flex-shrink:0;font-variant-numeric:tabular-nums;}

  /* ---------- Nav tabs ---------- */
  nav.tabs{display:flex;gap:2px;overflow-x:auto;background:var(--surface);border-bottom:1px solid var(--border);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px));position:sticky;top:calc(var(--header-h) + env(safe-area-inset-top,0px));z-index:25;scrollbar-width:none;height:var(--tabs-h);align-items:stretch;}
  nav.tabs::-webkit-scrollbar{display:none;}
  .tab-btn{display:flex;align-items:center;gap:6px;padding:0 12px;background:none;border:none;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-soft);white-space:nowrap;border-bottom:2.5px solid transparent;transition:color .15s, border-color .15s;flex-shrink:0;}
  .tab-btn svg{width:16px;height:16px;flex-shrink:0;}
  .tab-btn:hover{color:var(--ink);}
  .tab-btn.active{color:var(--accent-dark);border-bottom-color:var(--accent);}

  main{max-width:1180px;margin:0 auto;padding-top:16px;padding-bottom:90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
  .section{display:none;}
  .section.active{display:block;animation:fadein .2s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){.section.active{animation:none;}}

  .status{padding:10px 12px;border:1px solid var(--border);background:var(--amber-bg);color:var(--amber);border-radius:var(--radius);margin-bottom:14px;font-size:13px;font-weight:500;}

  .section-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .section-title{font-family:var(--font-display);font-size:19px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;}
  .section-sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;text-transform:none;letter-spacing:0;font-family:var(--font-body);}

  /* ---------- Buttons ---------- */
  .btn{font-weight:600;font-size:13.5px;padding:10px 16px;border-radius:var(--radius);border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:filter .15s, background .15s;min-height:40px;}
  .btn svg{width:15px;height:15px;}
  .btn-primary{background:var(--accent);color:var(--on-accent);}
  .btn-primary:hover{filter:brightness(1.07);}
  .btn-primary:disabled{opacity:.45;cursor:not-allowed;}
  .btn-ghost{background:var(--surface);color:var(--ink);border-color:var(--border);}
  .btn-ghost:hover{background:var(--surface-alt);}
  .icon-btn{background:none;border:none;cursor:pointer;color:var(--ink-soft);padding:8px;border-radius:4px;display:inline-flex;min-width:36px;min-height:36px;align-items:center;justify-content:center;}
  .icon-btn:hover{background:var(--surface-alt);color:var(--ink);}
  .icon-btn svg{width:16px;height:16px;}

  /* ---------- Dashboard plates ---------- */
  .plate-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin-bottom:18px;}
  .stat-plate{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px;position:relative;box-shadow:var(--shadow-sm);min-width:0;}
  .stat-plate::before,.stat-plate::after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:var(--border);top:7px;}
  .stat-plate::before{left:7px;}
  .stat-plate::after{right:7px;}
  .stat-plate .num{font-family:var(--font-display);font-size:25px;font-weight:700;line-height:1;color:var(--ink);word-break:break-word;font-variant-numeric:tabular-nums;}
  .stat-plate .lbl{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin-top:6px;font-weight:600;}
  .stat-plate.accent .num{color:var(--accent-dark);}
  .plate-grid-sub{margin-top:-6px;margin-bottom:18px;}
  .group-label{font-family:var(--font-display);font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 8px;}

  .dash-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;}
  .dash-grid>*{min-width:0;}
  @media (max-width:760px){.dash-grid{grid-template-columns:1fr;}}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow-sm);}
  .card h3{margin:0 0 12px;font-family:var(--font-display);font-size:13.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink);font-weight:600;}
  .bar-row{display:flex;align-items:center;gap:8px;margin-bottom:9px;font-size:12.5px;}
  .bar-row .blabel{width:84px;flex-shrink:0;color:var(--ink-soft);font-weight:600;}
  .bar-track{flex:1;background:var(--surface-alt);border-radius:3px;height:9px;overflow:hidden;border:1px solid var(--border);}
  .bar-fill{height:100%;border-radius:3px;}
  .bar-count{width:20px;text-align:right;font-weight:700;flex-shrink:0;font-variant-numeric:tabular-nums;}
  .empty-mini{color:var(--ink-faint);font-size:12.5px;padding:10px 0;}
  .mini-list{list-style:none;margin:0;padding:0;}
  .mini-list li{padding:8px 0;border-bottom:1px solid var(--border);font-size:12.5px;display:flex;justify-content:space-between;gap:8px;}
  .mini-list li:last-child{border-bottom:none;}
  .mini-list .mtitle{font-weight:600;color:var(--ink);min-width:0;overflow-wrap:anywhere;}
  .mini-list .msub{color:var(--ink-soft);font-size:11.5px;text-align:right;flex-shrink:0;max-width:50%;overflow-wrap:anywhere;}
  .mini-list .overdue{color:var(--red);font-weight:700;}
  .activity-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .activity-grid>*{min-width:0;}
  @media (max-width:680px){.activity-grid{grid-template-columns:1fr;}}

  /* ---------- Toolbar / search ---------- */
  body.no-fin .fin{display:none!important;}
  .toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center;}
  .search-input{flex:1;min-width:140px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:16px;background:var(--surface);color:var(--ink);}
  .search-input:focus{outline:none;border-color:var(--accent);}
  select.filter-select, input.date-filter{padding:10px 10px;border:1px solid var(--border);border-radius:var(--radius);font-size:16px;background:var(--surface);color:var(--ink);}
  .chip-btn{padding:9px 12px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink-soft);white-space:nowrap;}
  .chip-btn.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-dark);}

  /* ---------- Record cards ---------- */
  .data-list{display:flex;flex-direction:column;gap:8px;}
  .row-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 13px;box-shadow:var(--shadow-sm);}
  .row-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .row-top>div:first-child{min-width:0;}
  .row-title{font-weight:700;font-size:14px;color:var(--ink);overflow-wrap:anywhere;}
  .row-sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;overflow-wrap:anywhere;}
  .row-meta{display:flex;flex-wrap:wrap;gap:5px 14px;margin-top:9px;font-size:12.5px;color:var(--ink-soft);overflow-wrap:anywhere;}
  .row-meta b{color:var(--ink);font-weight:600;}
  .row-meta .overdue{color:var(--red);}
  .row-actions{display:flex;gap:0;flex-shrink:0;}

  /* ---------- Stamped status plate ---------- */
  .plate{display:inline-flex;align-items:center;font-family:var(--font-display);font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px 4px 7px;border-radius:3px;box-shadow:inset 0 1px 0 var(--plate-hi), inset 0 -1px 1px var(--plate-lo);white-space:nowrap;}
  .plate.green{background:var(--green-bg);color:var(--green);}
  .plate.amber{background:var(--amber-bg);color:var(--amber);}
  .plate.red{background:var(--red-bg);color:var(--red);}
  .plate.steel{background:var(--steel-bg);color:var(--steel);}
  .plate.gray{background:var(--gray-bg);color:var(--gray);}

  /* ---------- Empty state ---------- */
  .empty-state{text-align:center;padding:40px 18px;color:var(--ink-soft);}
  .empty-state svg{width:34px;height:34px;color:var(--ink-faint);margin-bottom:10px;}
  .empty-state .et{font-weight:700;color:var(--ink);font-size:14.5px;margin-bottom:4px;}
  .empty-state .es{font-size:13px;margin-bottom:16px;}

  /* ---------- Modal ---------- */
  .overlay{position:fixed;inset:0;background:var(--overlay);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);overflow-y:auto;}
  .overlay.open{display:flex;}
  .modal{background:var(--surface);color:var(--ink);border-radius:0;max-width:480px;width:100%;box-shadow:var(--shadow-md);margin:0;min-height:100%;}
  @media (min-width:560px){
    .overlay{padding:calc(24px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) calc(14px + env(safe-area-inset-left,0px));}
    .modal{border-radius:8px;margin-top:10px;min-height:0;}
  }
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:2;}
  .modal-head h3{margin:0;font-family:var(--font-display);font-size:15px;text-transform:uppercase;letter-spacing:.03em;}
  .modal-body{padding:16px;display:flex;flex-direction:column;gap:12px;}
  .modal-foot{padding:14px 16px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--surface);}
  .field label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;margin-bottom:5px;}
  .field input, .field select, .field textarea{width:100%;padding:10px 11px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface-alt);color:var(--ink);}
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--accent);background:var(--surface);}
  .field textarea{resize:vertical;min-height:54px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .field-row>*{min-width:0;}
  @media (max-width:420px){.field-row{grid-template-columns:1fr;}}
  .checkline{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);}
  .checkline input{width:auto;}

  /* ---------- Toast ---------- */
  #toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(20px);background:var(--toast-bg);color:var(--toast-fg);padding:10px 18px;border-radius:6px;font-size:13px;font-weight:600;box-shadow:var(--shadow-md);opacity:0;transition:opacity .2s, transform .2s;z-index:60;pointer-events:none;max-width:90vw;text-align:center;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #toast.err{background:var(--red);color:#fff;}

  .thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;}
  .thumb{width:64px;height:64px;object-fit:cover;border-radius:4px;border:1px solid var(--border);background:var(--surface-alt);cursor:pointer;display:block;}
  .thumb-wrap{position:relative;}
  .thumb-x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:none;background:var(--red);color:#fff;font-size:15px;line-height:1;cursor:pointer;padding:0;}
  .thumb-more{width:64px;height:64px;border-radius:4px;border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink-soft);font-weight:600;cursor:pointer;}
  .gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-bottom:18px;}
  .gal-grid .thumb{width:100%;height:auto;aspect-ratio:1;}
  .item-box{border:1px solid var(--border);border-radius:var(--radius);padding:12px;background:var(--surface-alt);display:flex;flex-direction:column;gap:10px;}
  .item-box .field input,.item-box .field select{background:var(--surface);}
  .filebtn{position:relative;overflow:hidden;}
  .filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0;}
  #viewer{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:80;display:none;align-items:center;justify-content:center;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);}
  #viewer.open{display:flex;}
  #vwImg{max-width:100%;max-height:78vh;object-fit:contain;}
  #vwCap{color:#fff;font-size:13px;padding:12px 56px 0;text-align:center;line-height:1.5;}
  .vw-btn{position:absolute;background:rgba(255,255,255,.14);color:#fff;border:none;width:44px;height:44px;border-radius:50%;font-size:26px;cursor:pointer;line-height:1;}
  .vw-close{top:calc(12px + env(safe-area-inset-top,0px));right:12px;}
  .vw-prev{left:8px;top:50%;} .vw-next{right:8px;top:50%;}
  ::selection{background:var(--accent-bg);}

  @media (max-width:380px){
    .brand-text .tag{display:none;}
    .today-pill{display:none;}
  }

  /* ---------- Login / account / team (standalone) ---------- */
  body:not(.authed) header.app-header, body:not(.authed) nav.tabs, body:not(.authed) main{display:none;}
  body.authed #login{display:none;}
  #login{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:var(--header-bg);padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));}
  .login-card{background:var(--surface);color:var(--ink);width:100%;max-width:380px;border-radius:8px;padding:26px 22px;box-shadow:var(--shadow-md);}
  .login-card .brand{margin-bottom:6px;}
  .login-card .brand-text .name{font-size:22px;color:var(--ink);}
  .login-card .brand-text .tag{color:var(--ink-soft);}
  .login-card form{display:flex;flex-direction:column;gap:12px;margin-top:18px;}
  .login-err{background:var(--red-bg);color:var(--red);padding:9px 11px;border-radius:var(--radius);font-size:13px;font-weight:500;}
  .login-hint{font-size:12px;color:var(--ink-faint);margin-top:14px;line-height:1.5;}
  .user-btn{background:rgba(255,255,255,.1);color:var(--header-fg);border:none;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0;min-height:30px;}
  .user-btn:hover{background:rgba(255,255,255,.18);}
  .header-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .byline{margin-top:7px;font-size:11px;color:var(--ink-faint);}
  .btn-sm{min-height:34px;padding:6px 12px;font-size:12.5px;}
  .btn-danger{background:var(--red-bg);color:var(--red);border-color:transparent;}

const COLS=['dies','customers','orders','maintenance','cutting','designs','payments'];
const FORM_COL={Die:'dies',Customer:'customers',Job:'jobs',Invoice:'invoices',Expense:'expenses',Capital:'capital',Drawing:'drawings',Order:'orders',Maint:'maintenance',Cutting:'cutting',Design:'designs',Payment:'payments'};
let ME=null, READY=false, slow=false, subErr='', writing=0, CHAN=null, POLL=null;
const LAST={}, META={};
COLS.forEach(c=>{LAST[c]={};META[c]={};});
/* Parties and payments are real tables (not JSON records) so balances and reports stay exact. */
const TABLES={
  customers:{table:'dieshop_parties',
    fromRow:r=>({id:r.id,partyNo:r.party_no,name:r.name,category:r.category,contact:r.contact,phone:r.phone,email:r.email,address:r.address,gstin:r.gstin,openingBalance:Number(r.opening_balance)||0,discountType:r.discount_type,discountValue:Number(r.discount_value)||0,notes:r.notes,createdAt:r.created_at}),
    toRow:o=>({id:o.id,name:o.name,category:o.category||'regular',contact:o.contact||'',phone:o.phone||'',email:o.email||'',address:o.address||'',gstin:o.gstin||'',opening_balance:Number(o.openingBalance)||0,discount_type:o.discountType||'percent',discount_value:Number(o.discountValue)||0,notes:o.notes||''})},
  payments:{table:'dieshop_payments',
    fromRow:r=>({id:r.id,customerId:r.party_id,date:r.pay_date,amount:Number(r.amount)||0,mode:r.mode,orderId:r.order_ref,invoiceId:r.invoice_id||'',notes:r.notes,createdAt:r.created_at}),
    toRow:o=>({id:o.id,party_id:o.customerId,pay_date:o.date,amount:Number(o.amount)||0,mode:o.mode||'Cash',order_ref:o.orderId||'',invoice_id:o.invoiceId||null,notes:o.notes||''})}
};

function colName(key){return key.replace('dieshop:','');}
function getArr(col){return {dies:DIES,customers:CUSTOMERS,orders:ORDERS,maintenance:MAINT,cutting:CUTTING,designs:DESIGNS,payments:PAYMENTS}[col];}
function assign(col,arr){
  if(col==='dies') DIES=arr; else if(col==='customers') CUSTOMERS=arr; else if(col==='orders') ORDERS=arr;
  else if(col==='maintenance') MAINT=arr; else if(col==='cutting') CUTTING=arr;
  else if(col==='designs') DESIGNS=arr; else if(col==='payments') PAYMENTS=arr;
}
function isOwner(){return !!ME&&ME.role==='owner';}
function roleOf(){return ME?ME.role:'';}
function canFinance(){return ['owner','partner','accountant'].includes(roleOf());}
function isManager(){return ['owner','partner'].includes(roleOf());}
const ROLE_LABEL={owner:'Owner',partner:'Managing Partner',accountant:'Accountant',designer:'Designer',operator:'Operator'};
const ROLE_TABS={
  owner:null,
  partner:['dashboard','dies','jobs','invoices','reports','expenses','partnership','gallery','cutting','designs','payments','customers','maintenance'],
  accountant:['dashboard','jobs','invoices','reports','expenses','gallery','payments','customers'],
  designer:['dashboard','dies','jobs','gallery','designs','customers'],
  operator:['dashboard','dies','jobs','gallery','cutting','maintenance']};
function tabAllowed(id){const a=ROLE_TABS[roleOf()];return a===null||(a&&a.includes(id))||(!ME);}

async function fetchCol(col){
  const T=TABLES[col];
  if(T){
    const rows=[];
    for(let from=0;;from+=1000){
      const {data,error}=await sb.from(T.table).select('*').order('id').range(from,from+999);
      if(error) throw error;
      rows.push(...data);
      if(data.length<1000) break;
    }
    const m={},mt={},arr=[];
    rows.forEach(r=>{const o=T.fromRow(r);arr.push(o);m[o.id]=JSON.stringify(o);mt[o.id]={by:r.updated_by_name,at:r.updated_at};});
    LAST[col]=m;META[col]=mt;assign(col,arr);
    return;
  }
  const rows=[];
  for(let from=0;;from+=1000){
    const {data,error}=await sb.from('dieshop_records').select('id,data,updated_at,updated_by_name').eq('collection',col).order('id').range(from,from+999);
    if(error) throw error;
    rows.push(...data);
    if(data.length<1000) break;
  }
  const m={},mt={},arr=[];
  rows.forEach(r=>{const o=r.data||{};o.id=r.id;arr.push(o);m[r.id]=JSON.stringify(o);mt[r.id]={by:r.updated_by_name,at:r.updated_at};});
  LAST[col]=m;META[col]=mt;assign(col,arr);
}
async function refreshAll(){
  if(document.hidden||writing>0||!ME) return;
  try{ await Promise.all([...COLS.map(fetchCol),fetchJobs(),fetchProfiles(),fetchInvoices(),fetchSettings(),fetchFinance()]); subErr=''; updateStatus(); scheduleRender(); }catch(e){}
}
function applyTableChange(col,p){
  const T=TABLES[col];
  if(p.eventType==='DELETE'){
    const id=p.old.id; delete LAST[col][id]; delete META[col][id];
    assign(col,getArr(col).filter(o=>o.id!==id));
  }else{
    const r=p.new, o=T.fromRow(r);
    LAST[col][o.id]=JSON.stringify(o); META[col][o.id]={by:r.updated_by_name,at:r.updated_at};
    const arr=getArr(col).slice(); const i=arr.findIndex(x=>x.id===o.id);
    if(i>-1) arr[i]=o; else arr.push(o);
    assign(col,arr);
  }
  scheduleRender();
}
function applyChange(p){
  const col=(p.new&&p.new.collection)||(p.old&&p.old.collection);
  if(!COLS.includes(col)) return;
  if(p.eventType==='DELETE'){
    const id=p.old.id; delete LAST[col][id]; delete META[col][id];
    assign(col,getArr(col).filter(o=>o.id!==id));
  }else{
    const r=p.new; const o=r.data||{}; o.id=r.id;
    LAST[col][r.id]=JSON.stringify(o); META[col][r.id]={by:r.updated_by_name,at:r.updated_at};
    const arr=getArr(col).slice(); const i=arr.findIndex(x=>x.id===r.id);
    if(i>-1) arr[i]=o; else arr.push(o);
    assign(col,arr);
  }
  scheduleRender();
}
async function startData(){
  READY=false; subErr=''; updateStatus(); renderAll();
  const slowTimer=setTimeout(()=>{slow=true;updateStatus();},10000);
  try{ await Promise.all([...COLS.map(fetchCol),fetchJobs(),fetchProfiles(),fetchInvoices(),fetchSettings(),fetchFinance()]); READY=true; }
  catch(e){ subErr='load'; READY=true; }
  clearTimeout(slowTimer); slow=false;
  updateStatus(); renderAll();
  CHAN=sb.channel('dieshop-rt').on('postgres_changes',{event:'*',schema:'public',table:'dieshop_records'},applyChange)
    .on('postgres_changes',{event:'*',schema:'public',table:'dieshop_parties'},p=>applyTableChange('customers',p))
    .on('postgres_changes',{event:'*',schema:'public',table:'dieshop_payments'},p=>applyTableChange('payments',p))
    .on('postgres_changes',{event:'*',schema:'public',table:'dieshop_jobs'},jobsChanged)
    .on('postgres_changes',{event:'*',schema:'public',table:'dieshop_job_items'},jobsChanged)
    .on('postgres_changes',{event:'*',schema:'public',table:'dieshop_job_images'},jobsChanged)
    .on('postgres_changes',{event:'*',schema:'public',table:'dieshop_invoices'},jobsChanged)
    .on('postgres_changes',{event:'*',schema:'public',table:'dieshop_invoice_lines'},jobsChanged)
    .on('postgres_changes',{event:'*',schema:'public',table:'dieshop_expenses'},jobsChanged)
    .on('postgres_changes',{event:'*',schema:'public',table:'dieshop_capital'},jobsChanged)
    .on('postgres_changes',{event:'*',schema:'public',table:'dieshop_drawings'},jobsChanged)
    .on('postgres_changes',{event:'*',schema:'public',table:'dieshop_profit_closings'},jobsChanged)
    .subscribe(st=>{ /* polling below covers any gap */ });
  POLL=setInterval(refreshAll,60000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refreshAll(); });
  window.addEventListener('online',refreshAll);
}

/* Write only what changed: new or edited records are saved, removed ones deleted. */
async function setList(key,list){
  const col=colName(key);
  const T=TABLES[col];
  const tbl=T?T.table:'dieshop_records';
  const last=LAST[col];
  const ids=new Set(list.map(o=>o.id));
  const toSet=[];
  list.forEach(o=>{ const s=JSON.stringify(o); if(last[o.id]!==s) toSet.push([o.id,s]); });
  const toDelete=Object.keys(last).filter(id=>!ids.has(id));
  writing++;
  try{
    for(let i=0;i<toSet.length;i+=200){
      const chunk=toSet.slice(i,i+200);
      const {error}=T?await sb.from(tbl).upsert(chunk.map(([id,s])=>T.toRow(JSON.parse(s))),{onConflict:'id'})
        :await sb.from(tbl).upsert(chunk.map(([id,s])=>({collection:col,id,data:JSON.parse(s)})),{onConflict:'collection,id'});
      if(error) throw error;
      chunk.forEach(([id,s])=>{last[id]=s;});
    }
    for(let i=0;i<toDelete.length;i+=200){
      const chunk=toDelete.slice(i,i+200);
      const {error}=T?await sb.from(tbl).delete().in('id',chunk):await sb.from(tbl).delete().eq('collection',col).in('id',chunk);
      if(error) throw error;
      chunk.forEach(id=>{delete last[id];delete META[col][id];});
    }
    return true;
  }catch(e){
    if(e&&e.code==='23503'){showToast("Is party ki payments hain, pehle wo hatao.",true);fetchCol(col).then(scheduleRender).catch(()=>{});return false;}
    showToast((e&&e.message&&/JWT|expired|permission|policy/i.test(e.message))?"Save nahi hua. Dobara login karein.":"Save nahi hua. Internet check karke dobara try karein.",true);
    fetchCol(col).then(scheduleRender).catch(()=>{});
    return false;
  }finally{ writing--; }
}

function updateStatus(){
  const bar=document.getElementById('statusBar');
  let msg='';
  if(subErr) msg="Shop data load nahi ho paya. Internet check karke page reload karein.";
  else if(slow) msg="Shop data abhi nahi mil raha. Jo dikh raha hai wo purana ho sakta hai.";
  bar.textContent=msg;
  bar.hidden=!msg;
}

let rafPending=false;
function scheduleRender(){
  if(rafPending) return;
  rafPending=true;
  requestAnimationFrame(()=>{ rafPending=false; rr(renderAll); });
}

function loadingBlock(){
  return `<div class="empty-state"><div class="et">Loading shop data…</div><div class="es">Dies, orders and daily logs are being fetched.</div></div>`;
}

/* ===================== TOAST ===================== */
let toastTimer;
function showToast(msg,isErr){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.className=isErr?'show err':'show';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{t.className='';},isErr?4200:2400);
}

/* ===================== NAV ===================== */
function renderTabs(){
  const nav=document.getElementById('tabs');
  if(!tabAllowed(activeTab)) activeTab='dashboard';
  nav.innerHTML=TABS.filter(t=>tabAllowed(t.id)).map(t=>`
    <button class="tab-btn ${t.id===activeTab?'active':''}" onclick="switchTab('${t.id}')">
      ${ICON[t.icon]}<span>${t.label}</span>
    </button>`).join('');
  const act=nav.querySelector('.tab-btn.active'); if(act) nav.scrollLeft=act.offsetLeft-(nav.clientWidth-act.offsetWidth)/2;
  const pill=document.getElementById('todayPill');
  pill.textContent=new Date().toLocaleDateString('en-IN',{weekday:'short',day:'2-digit',month:'short'});
}
function switchTab(id){
  activeTab=id;
  try{ localStorage.setItem('dietrack:tab',id); }catch(e){}
  renderTabs();
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById('sec-'+id).classList.add('active');
  renderAll();
  window.scrollTo({top:0,behavior:'instant'});
}

/* ===================== RENDER ALL ===================== */
function renderAll(){
  renderDashboard();
  renderDies();
  renderJobs();
  renderInvoices();
  renderReports();
  renderExpenses();
  renderPartnership();
  renderGallery();
  renderCutting();
  renderDesigns();
  renderPayments();
  renderCustomers();
  renderMaintenance();
}

/* ===================== DASHBOARD ===================== */
function renderDashboard(){
  const el=document.getElementById('sec-dashboard');
  if(!READY){el.innerHTML=loadingBlock();return;}
  const today=todayISO();
  const totalDies=DIES.length;
  const available=DIES.filter(d=>d.status==='Available').length;
  const inMaint=DIES.filter(d=>d.status==='Maintenance').length;
  const activeOrders=JOBS.filter(j=>!['Delivered','Closed'].includes(j.status)).length;
  const totalCustomers=CUSTOMERS.length;
  const billedToday=INVOICES.filter(i=>i.status==='issued'&&i.date===todayISO()).reduce((s,i)=>s+i.total,0);
  const outstanding=CUSTOMERS.reduce((s,c)=>s+Math.max(0,partyBalance(c)),0);
  const revenue=JOBS.filter(j=>['Delivered','Closed'].includes(j.status)).reduce((s,j)=>s+jobTotals(j).all,0);

  const cutToday=CUTTING.filter(c=>c.date===today);
  const dieCutToday=cutToday.reduce((s,c)=>s+(Number(c.qty)||0),0);
  const designsToday=DESIGNS.filter(d=>d.date===today);
  const designCountToday=designsToday.reduce((s,d)=>s+(Number(d.qty)||1),0);
  const paymentsToday=PAYMENTS.filter(p=>p.date===today);
  const paymentTotalToday=paymentsToday.reduce((s,p)=>s+(Number(p.amount)||0),0);

  function statusBars(list,statuses,key){
    if(!list.length) return `<div class="empty-mini">No data yet.</div>`;
    const total=list.length;
    return statuses.map(s=>{
      const count=list.filter(x=>x[key]===s.v).length;
      const pct=total?Math.round(count/total*100):0;
      const colorVar = s.c==='green'?'var(--green)':s.c==='amber'?'var(--amber)':s.c==='red'?'var(--red)':s.c==='steel'?'var(--steel)':'var(--gray)';
      return `<div class="bar-row">
        <div class="blabel">${esc(s.v)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${colorVar}"></div></div>
        <div class="bar-count">${count}</div>
      </div>`;
    }).join('');
  }

  const upcoming=MAINT.filter(m=>m.nextService).sort((a,b)=>a.nextService.localeCompare(b.nextService)).slice(0,5);
  const upcomingHtml=upcoming.length? `<ul class="mini-list">${upcoming.map(m=>{
      const die=DIES.find(d=>d.id===m.dieId);
      const overdue=m.nextService<today;
      return `<li><span class="mtitle">${esc(die?die.dieNo:'—')} ${die?'· '+esc(die.name):''}</span>
        <span class="msub ${overdue?'overdue':''}">${overdue?'Overdue · ':'Due '}${fmtDate(m.nextService)}</span></li>`;
    }).join('')}</ul>` : `<div class="empty-mini">No upcoming services scheduled.</div>`;

  const recentOrders=[...JOBS].sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')).slice(0,5);
  const recentHtml=recentOrders.length? `<ul class="mini-list">${recentOrders.map(o=>{
      const cust=CUSTOMERS.find(c=>c.id===o.customerId);
      return `<li><span class="mtitle">${esc(o.jobNo)} · ${esc(cust?cust.name:'—')}</span><span class="msub">${plateFor(o.status,JOB_STATUSES)}</span></li>`;
    }).join('')}</ul>` : `<div class="empty-mini">No jobs yet.</div>`;

  function activityList(items,render){
    if(!items.length) return `<div class="empty-mini">Nothing logged today.</div>`;
    return `<ul class="mini-list">${items.map(render).join('')}</ul>`;
  }
  const cuttingActivityHtml=activityList(cutToday,c=>{
    const die=DIES.find(d=>d.id===c.dieId), cust=CUSTOMERS.find(x=>x.id===c.customerId);
    return `<li><span class="mtitle">${esc(die?die.dieNo:'—')} · ${esc(cust?cust.name:'—')}</span><span class="msub">${c.qty} pcs</span></li>`;
  });
  const designActivityHtml=activityList(designsToday,d=>{
    const cust=CUSTOMERS.find(x=>x.id===d.customerId);
    return `<li><span class="mtitle">${esc(d.designName)}</span><span class="msub">${esc(d.designerName)}${cust?' · '+esc(cust.name):''}</span></li>`;
  });
  const paymentActivityHtml=activityList(paymentsToday,p=>{
    const cust=CUSTOMERS.find(x=>x.id===p.customerId);
    return `<li><span class="mtitle">${esc(cust?cust.name:'—')}</span><span class="msub">${fmtMoney(p.amount)}</span></li>`;
  });

  el.innerHTML=`
    <div class="section-head">
      <div><div class="section-title">Dashboard</div><div class="section-sub">Shop overview at a glance</div></div>
    </div>

    <div class="group-label">Today</div>
    <div class="plate-grid plate-grid-sub">
      <div class="stat-plate accent"><div class="num">${dieCutToday}</div><div class="lbl">Dies Cut Today</div></div>
      <div class="stat-plate accent"><div class="num">${designCountToday}</div><div class="lbl">Designs Today</div></div>
      <div class="stat-plate fin accent"><div class="num">${fmtMoney(billedToday)}</div><div class="lbl">Billed Today</div></div>
      <div class="stat-plate fin accent"><div class="num">${fmtMoney(paymentTotalToday)}</div><div class="lbl">Payment Received Today</div></div>
    </div>

    ${isManager()?monthCardHtml():''}
    <div class="group-label">Overall</div>
    <div class="plate-grid">
      <div class="stat-plate"><div class="num">${totalDies}</div><div class="lbl">Total Dies</div></div>
      <div class="stat-plate"><div class="num">${available}</div><div class="lbl">Available</div></div>
      <div class="stat-plate"><div class="num">${inMaint}</div><div class="lbl">In Maintenance</div></div>
      <div class="stat-plate"><div class="num">${activeOrders}</div><div class="lbl">Open Jobs</div></div>
      <div class="stat-plate"><div class="num">${totalCustomers}</div><div class="lbl">Parties</div></div>
      <div class="stat-plate fin accent"><div class="num">${fmtMoney(outstanding)}</div><div class="lbl">Party Outstanding</div></div>
      <div class="stat-plate fin"><div class="num">${fmtMoney(revenue)}</div><div class="lbl">Delivered Job Value</div></div>
    </div>

    <div class="card" style="margin-bottom:14px;">
      <h3>Today's Activity</h3>
      <div class="activity-grid">
        <div><div class="group-label" style="margin-bottom:6px;">Cutting</div>${cuttingActivityHtml}</div>
        <div><div class="group-label" style="margin-bottom:6px;">Designs</div>${designActivityHtml}</div>
        <div><div class="group-label" style="margin-bottom:6px;">Payments</div>${paymentActivityHtml}</div>
      </div>
    </div>

    <div class="dash-grid">
      <div style="display:flex;flex-direction:column;gap:14px;">
        <div class="card"><h3>Dies by Status</h3>${statusBars(DIES,DIE_STATUSES,'status')}</div>
        <div class="card"><h3>Jobs by Status</h3>${statusBars(JOBS,JOB_STATUSES,'status')}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:14px;">
        <div class="card"><h3>Upcoming Maintenance</h3>${upcomingHtml}</div>
        <div class="card"><h3>Recent Jobs</h3>${recentHtml}</div>
      </div>
    </div>
  `;
}

/* ===================== DIES ===================== */
let dieSearch='', dieFilter='';
function renderDies(){
  const el=document.getElementById('sec-dies');
  if(!READY){el.innerHTML=loadingBlock();return;}
  let list=DIES.filter(d=>
    (!dieFilter||d.status===dieFilter) &&
    (!dieSearch || (d.dieNo+' '+d.name+' '+(d.location||'')).toLowerCase().includes(dieSearch.toLowerCase()))
  ).sort((a,b)=>(a.dieNo||'').localeCompare(b.dieNo||''));

  el.innerHTML=`
    <div class="section-head">
      <div><div class="section-title">Dies</div><div class="section-sub">${DIES.length} die${DIES.length===1?'':'s'} in your shop</div></div>
      <button class="btn btn-primary" onclick="openDieForm()">${ICON.plus} Add Die</button>
    </div>
    <div class="toolbar">
      <input class="search-input" id="dieSearchInput" placeholder="Search by die no, name, location..." value="${esc(dieSearch)}" oninput="dieSearch=this.value;rr(renderDies)">
      <select class="filter-select" onchange="dieFilter=this.value;renderDies()">
        <option value="">All statuses</option>
        ${DIE_STATUSES.map(s=>`<option value="${s.v}" ${dieFilter===s.v?'selected':''}>${s.v}</option>`).join('')}

  const listEl=document.getElementById('diesList');
  if(!list.length){
    listEl.innerHTML=`<div class="empty-state">${ICON.box}<div class="et">${DIES.length?'No matching dies':'No dies yet'}</div><div class="es">${DIES.length?'Try a different search or filter.':'Add your first die to start tracking your tooling.'}</div>${!DIES.length?`<button class="btn btn-primary" onclick="openDieForm()">${ICON.plus} Add Die</button>`:''}</div>`;
    return;
  }
  listEl.innerHTML=list.map(d=>`
    <div class="row-card">
      <div class="row-top">
        <div>
          <div class="row-title">${esc(d.dieNo)} — ${esc(d.name)}</div>
          <div class="row-sub">${esc(d.type||'—')}${d.size?' · '+esc(d.size):''}</div>

        <div style="display:flex;align-items:center;gap:6px;">
          ${plateFor(d.status,DIE_STATUSES)}

            <button class="icon-btn" aria-label="Edit die" onclick="openDieForm('${d.id}')">${ICON.edit}</button>
            <button class="icon-btn" aria-label="Delete die" onclick="deleteDie('${d.id}')">${ICON.trash}</button>
          </div>
        </div>
      </div>
      <div class="row-meta">
        ${d.material?`<span><b>Material:</b> ${esc(d.material)}</span>`:''}
        ${d.location?`<span><b>Location:</b> ${esc(d.location)}</span>`:''}
        ${d.lastServiced?`<span><b>Last serviced:</b> ${fmtDate(d.lastServiced)}</span>`:''}
      </div>
      ${d.notes?`<div class="row-meta" style="margin-top:4px;">${esc(d.notes)}</div>`:''}
    </div>
  `).join('');
}

async function saveDie(id){

  if(!dieNo||!name){showToast('Die No and Name are required.',true);return;}

    id:id||uid('die'),
    dieNo, name,
    type:document.getElementById('f_type').value,
    status:document.getElementById('f_status').value,

    material:document.getElementById('f_material').value.trim(),
    location:document.getElementById('f_location').value.trim(),

  };

async function deleteDie(id){
  if(!confirm('Delete this die? This cannot be undone.'))return;
  DIES=DIES.filter(d=>d.id!==id);
  const ok=await setList('dieshop:dies',DIES);
  if(ok){showToast('Die deleted.');renderAll();}
}

/* ===================== PARTIES (Party Master + ledger) ===================== */
const CAT=[{v:'regular',l:'Regular Party',c:'steel'},{v:'walkin',l:'Walk-in',c:'gray'},{v:'related',l:'Related Party',c:'amber'}];
function catPlate(v){const m=CAT.find(x=>x.v===v)||CAT[0];return `<span class="plate ${m.c}">${m.l}</span>`;}
function partyReceived(id){return PAYMENTS.filter(p=>p.customerId===id).reduce((s,p)=>s+(Number(p.amount)||0),0);}
/* Outstanding = opening + billed (issued invoices) - received (all payments). */
function partyBilled(id){return INVOICES.filter(i=>i.customerId===id&&i.status==='issued').reduce((s,i)=>s+i.total,0);}
function partyBalance(c){return Math.round(((Number(c.openingBalance)||0)+partyBilled(c.id)-partyReceived(c.id))*100)/100;}
function balHtml(b){
  if(b>0) return `<span class="overdue"><b>Baaki:</b> ${fmtMoney(b)}</span>`;
  if(b<0) return `<span style="color:var(--green)"><b>Advance:</b> ${fmtMoney(-b)}</span>`;
  return `<span><b>Baaki:</b> ₹0</span>`;
}

    <div class="row-card">

        <div>
          <div class="row-title">${esc(c.name)}</div>
          <div class="row-sub">${esc(c.partyNo||'')}${c.contact?' · '+esc(c.contact):''}</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;">
          ${catPlate(c.category)}

      <div class="row-meta">

        ${c.phone?`<span><b>Phone:</b> ${esc(c.phone)}</span>`:''}
        ${c.gstin?`<span><b>GST:</b> ${esc(c.gstin)}</span>`:''}

        <span><b>Jobs:</b> ${orderCount}</span>
      </div>
      ${c.address?`<div class="row-meta" style="margin-top:4px;">${esc(c.address)}</div>`:''}
      <div class="team-actions"><button class="btn btn-ghost btn-sm" onclick="openLedger('${c.id}')">Ledger / Statement</button></div>
    </div>`;
  }).join('');
}
function ledgerEntries(c){
  const rows=[];
  INVOICES.filter(i=>i.customerId===c.id&&i.status==='issued').forEach(i=>rows.push({date:i.date,at:i.createdAt||'',label:'Invoice '+i.invoiceNo,debit:i.total,credit:0}));
  PAYMENTS.filter(p=>p.customerId===c.id).forEach(p=>{const inv=INVOICES.find(x=>x.id===p.invoiceId);rows.push({date:p.date,at:p.createdAt||'',label:'Payment ('+(p.mode||'')+')'+(inv?' - '+inv.invoiceNo:''),debit:0,credit:Number(p.amount)||0});});
  rows.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.at||'').localeCompare(b.at||''));
  let run=Number(c.openingBalance)||0;
  rows.forEach(r=>{run=Math.round((run+r.debit-r.credit)*100)/100;r.balance=run;});
  return rows;
}
function openLedger(id){
  const c=CUSTOMERS.find(x=>x.id===id); if(!c) return;
  const rows=ledgerEntries(c);
  const li=rows.map(r=>`<li><span class="mtitle">${fmtDate(r.date)} · ${esc(r.label)}<br><span style="font-weight:400;color:var(--ink-soft)">${r.debit?'Bill '+fmtMoney(r.debit):'Jama '+fmtMoney(r.credit)}</span></span><span class="msub" style="${r.balance>0?'color:var(--red)':'color:var(--green)'}">${r.balance>=0?'Baaki ':'Advance '}${fmtMoney(Math.abs(r.balance))}</span></li>`).join('');
  document.getElementById('modalTitle').textContent='Ledger';
  document.getElementById('modalBody').innerHTML=`

      <div class="stat-plate"><div class="num">${fmtMoney(partyReceived(id))}</div><div class="lbl">Mila</div></div>

async function saveCustomer(id){
  const name=document.getElementById('f_name').value.trim();
  if(!name){showToast('Name zaroori hai.',true);return;}
  const dv=Number(document.getElementById('f_dvalue').value)||0;
  if(dv<0){showToast('Discount minus nahi ho sakta.',true);return;}
  const dt=document.getElementById('f_dtype').value;
  if(dt==='percent'&&dv>100){showToast('Discount 100% se zyada nahi ho sakta.',true);return;}
  const old=id?CUSTOMERS.find(c=>c.id===id):null;
  const obj=Object.assign({},old||{},{
    id:id||crypto.randomUUID(),
    name,
    category:document.getElementById('f_category').value,
    contact:document.getElementById('f_contact').value.trim(),
    phone:document.getElementById('f_phone').value.trim(),
    email:document.getElementById('f_email').value.trim(),
    address:document.getElementById('f_address').value.trim(),
    gstin:document.getElementById('f_gstin').value.trim().toUpperCase(),
    openingBalance:Number(document.getElementById('f_opening').value)||0,
    discountType:dt, discountValue:dv,
    notes:document.getElementById('f_notes').value.trim(),
  });
  const idx=CUSTOMERS.findIndex(c=>c.id===id);
  if(idx>-1) CUSTOMERS[idx]=obj; else CUSTOMERS.push(obj);
  const ok=await setList('dieshop:customers',CUSTOMERS);
  if(ok){closeModal();showToast(id?'Party update ho gayi.':'Party add ho gayi.');renderAll();}
}
async function deleteCustomer(id){
  const used=PAYMENTS.some(x=>x.customerId===id)||JOBS.some(x=>x.customerId===id)||CUTTING.some(x=>x.customerId===id)||DESIGNS.some(x=>x.customerId===id);
  if(used){showToast('Is party ke orders ya payments hain, isliye delete nahi ho sakti.',true);return;}
  if(!confirm('Is party ko delete karein?'))return;
  CUSTOMERS=CUSTOMERS.filter(c=>c.id!==id);
  const ok=await setList('dieshop:customers',CUSTOMERS);
  if(ok){showToast('Party delete ho gayi.');renderAll();}
}
/* Quick-add from inside any form that has a party picker. */
async function quickParty(ev){
  ev.preventDefault();
  const sel=document.getElementById('f_customerId'); if(!sel) return;
  const name=(prompt('Party / customer ka naam?')||'').trim(); if(!name) return;
  const walk=confirm('Walk-in customer hai?\nOK = Walk-in, Cancel = Regular party');
  const obj={id:crypto.randomUUID(),name,category:walk?'walkin':'regular',contact:'',phone:'',email:'',address:'',gstin:'',openingBalance:0,discountType:'percent',discountValue:0,notes:''};
  CUSTOMERS.push(obj);
  const ok=await setList('dieshop:customers',CUSTOMERS);
  if(!ok){CUSTOMERS=CUSTOMERS.filter(c=>c.id!==obj.id);return;}
  const o=document.createElement('option'); o.value=obj.id; o.textContent=name; sel.appendChild(o); sel.value=obj.id;
  showToast('Party add ho gayi.');
}

  let max=0;

async function saveCutting(id){
  const dieId=document.getElementById('f_dieId').value;
  const customerId=document.getElementById('f_customerId').value;
  const qty=Number(document.getElementById('f_qty').value)||0;
  if(!dieId||!customerId||!qty){showToast('Die, customer and quantity are required.',true);return;}
  const editing=id?CUTTING.find(c=>c.id===id):null;
  const oldQty=editing?Number(editing.qty)||0:0;
  const oldOrderId=editing?editing.orderId:'';
  const orderId=document.getElementById('f_orderId').value||'';
  const obj={
    id:id||uid('cut'),
    date:document.getElementById('f_date').value||todayISO(),
    dieId, customerId, orderId, qty,
    operator:document.getElementById('f_operator').value.trim(),
    notes:document.getElementById('f_notes').value.trim(),
    createdAt:editing?editing.createdAt:new Date().toISOString(),
  };
  const idx=CUTTING.findIndex(c=>c.id===id);
  if(idx>-1) CUTTING[idx]=obj; else CUTTING.push(obj);

  let ordersChanged=false;
  if(oldOrderId && oldOrderId!==orderId){
    const oOld=ORDERS.find(o=>o.id===oldOrderId);
    if(oOld){oOld.qtyProduced=Math.max(0,(Number(oOld.qtyProduced)||0)-oldQty);ordersChanged=true;}
  }
  if(orderId){
    const oNew=ORDERS.find(o=>o.id===orderId);
    if(oNew){
      if(oldOrderId===orderId){
        oNew.qtyProduced=Math.max(0,(Number(oNew.qtyProduced)||0)-oldQty+qty);
      }else{
        oNew.qtyProduced=(Number(oNew.qtyProduced)||0)+qty;
      }
      ordersChanged=true;
    }
  }
  const [ok1,ok2]=await Promise.all([
    setList('dieshop:cutting',CUTTING),
    ordersChanged?setList('dieshop:orders',ORDERS):Promise.resolve(true)
  ]);
  if(ok1&&ok2){closeModal();showToast(id?'Entry updated.':'Cutting logged.');renderAll();}
}
async function deleteCutting(id){
  if(!confirm('Delete this cutting entry?'))return;
  const entry=CUTTING.find(c=>c.id===id);
  CUTTING=CUTTING.filter(c=>c.id!==id);
  let ordersChanged=false;
  if(entry && entry.orderId){
    const o=ORDERS.find(x=>x.id===entry.orderId);
    if(o){o.qtyProduced=Math.max(0,(Number(o.qtyProduced)||0)-(Number(entry.qty)||0));ordersChanged=true;}
  }
  const [ok1,ok2]=await Promise.all([
    setList('dieshop:cutting',CUTTING),
    ordersChanged?setList('dieshop:orders',ORDERS):Promise.resolve(true)
  ]);
  if(ok1&&ok2){showToast('Entry deleted.');renderAll();}
}

async function saveMaint(id){
  const dieId=document.getElementById('f_dieId').value;
  if(!dieId){showToast('Die is required.',true);return;}
  const date=document.getElementById('f_date').value||todayISO();
  const old=id?MAINT.find(m=>m.id===id):null;
  const obj={
    id:id||uid('mnt'),
    dieId, date,
    cost:Number(document.getElementById('f_cost').value)||0,
    issue:document.getElementById('f_issue').value.trim(),
    action:document.getElementById('f_action').value.trim(),
    nextService:document.getElementById('f_nextService').value,
    createdAt:old?(old.createdAt||todayISO()):todayISO(),
  };
  const idx=MAINT.findIndex(m=>m.id===id);
  if(idx>-1) MAINT[idx]=obj; else MAINT.push(obj);

  const dIdx=DIES.findIndex(d=>d.id===dieId);
  let dieChanged=false;
  if(dIdx>-1){
    if(!DIES[dIdx].lastServiced || date>DIES[dIdx].lastServiced){DIES[dIdx].lastServiced=date;dieChanged=true;}
    if(document.getElementById('f_markMaint').checked && DIES[dIdx].status!=='Maintenance'){DIES[dIdx].status='Maintenance';dieChanged=true;}
  }
  const [ok1,ok2]=await Promise.all([
    setList('dieshop:maintenance',MAINT),
    dieChanged?setList('dieshop:dies',DIES):Promise.resolve(true)
  ]);
  if(ok1&&ok2){closeModal();showToast(id?'Record updated.':'Service logged.');renderAll();}
}
async function deleteMaint(id){
  if(!confirm('Delete this service record?'))return;
  MAINT=MAINT.filter(m=>m.id!==id);
  const ok=await setList('dieshop:maintenance',MAINT);
  if(ok){showToast('Record deleted.');renderAll();}
}

/* ----- images: private bucket, short-lived signed links ----- */
async function ensureUrls(paths){
  const now=Date.now();
  const need=[...new Set(paths)].filter(p=>!IMGURL[p]||IMGURL[p].exp<now+60000);
  for(let i=0;i<need.length;i+=100){
    const chunk=need.slice(i,i+100);
    const {data,error}=await sb.storage.from(BUCKET).createSignedUrls(chunk,3600);
    if(error||!data) continue;
    data.forEach(d=>{ if(d.signedUrl&&d.path) IMGURL[d.path]={url:d.signedUrl,exp:now+3600000}; });
  }
}
function hydrateImages(){
  const imgs=[...document.querySelectorAll('img[data-path]')];
  const missing=[];
  imgs.forEach(im=>{
    const c=IMGURL[im.dataset.path];
    if(c&&c.exp>Date.now()){ if(im.getAttribute('src')!==c.url) im.src=c.url; }
    else missing.push(im.dataset.path);
  });
  if(missing.length) ensureUrls(missing).then(()=>{
    imgs.forEach(im=>{const c=IMGURL[im.dataset.path]; if(c&&!im.getAttribute('src')) im.src=c.url;});
  });
}
async function compressImage(file){
  try{
    const bmp=await createImageBitmap(file);
    const sc=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const w=Math.round(bmp.width*sc), h=Math.round(bmp.height*sc);
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    cv.getContext('2d').drawImage(bmp,0,0,w,h);
    const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.82));
    if(blob) return blob;
  }catch(e){}
  return ['image/jpeg','image/png','image/webp'].includes(file.type)?file:null;
}

function entriesForJob(j){
  const out=[];

function showViewer(){
  const e=VW.list[VW.idx]; if(!e) return;
  const v=document.getElementById('viewer'), im=document.getElementById('vwImg');
  im.removeAttribute('src');
  const c=IMGURL[e.path];
  if(c&&c.exp>Date.now()) im.src=c.url; else ensureUrls([e.path]).then(()=>{const c2=IMGURL[e.path]; if(c2&&VW.list[VW.idx]===e) im.src=c2.url;});

  v.classList.add('open'); document.body.style.overflow='hidden';

function stepViewer(d){ if(!VW.list.length) return; VW.idx=(VW.idx+d+VW.list.length)%VW.list.length; showViewer(); }
function closeViewer(){document.getElementById('viewer').classList.remove('open'); if(!document.getElementById('overlay').classList.contains('open')) document.body.style.overflow='';}
document.addEventListener('keydown',e=>{
  if(!document.getElementById('viewer').classList.contains('open')) return;
  if(e.key==='Escape') closeViewer(); else if(e.key==='ArrowLeft') stepViewer(-1); else if(e.key==='ArrowRight') stepViewer(1);
});

async function saveJob(){
  const party=document.getElementById('f_customerId').value;
  if(!party){showToast('Party chuno.',true);return;}
  for(let i=0;i<JF.items.length;i++){
    const it=JF.items[i], n='Die item '+(i+1)+': ';
    if(!String(it.designName).trim()){showToast(n+'design name likho.',true);return;}
    if(!(parseInt(it.qty,10)>0)){showToast(n+'qty 1 ya zyada honi chahiye.',true);return;}
    if([it.designingCharge,it.cuttingCharge,it.otherCharge].some(v=>Number(v)<0)){showToast(n+'charges minus nahi ho sakte.',true);return;}
    if(!it.images.length){showToast(n+'image zaroori hai (Camera ya Gallery se).',true);return;}
  }
  const btn=document.getElementById('modalSaveBtn');
  btn.disabled=true; btn.textContent='Save ho raha hai…';
  const uploaded=[];
  try{
    for(const it of JF.items){
      for(const g of it.images){
        if(g.existing||g.path) continue;
        const ext=g.blob.type==='image/png'?'png':g.blob.type==='image/webp'?'webp':'jpg';
        const path=JF.id+'/'+it.id+'/'+crypto.randomUUID()+'.'+ext;
        const {error}=await sb.storage.from(BUCKET).upload(path,g.blob,{contentType:g.blob.type||'image/jpeg'});
        if(error) throw error;
        uploaded.push(path); g.path=path;
      }
    }
    const payload={id:JF.id,party_id:party,job_date:document.getElementById('f_date').value||todayISO(),
      operator:document.getElementById('f_operator').value.trim(),status:document.getElementById('f_status').value,
      notes:document.getElementById('f_notes').value.trim(),
      items:JF.items.map(it=>({id:it.id,design_name:String(it.designName).trim(),die_size:String(it.dieSize||'').trim(),qty:parseInt(it.qty,10),service:it.service,
        designing_charge:Number(it.designingCharge)||0,cutting_charge:Number(it.cuttingCharge)||0,other_charge:Number(it.otherCharge)||0,images:it.images.map(g=>g.path)}))};
    const {error}=await sb.rpc('dieshop_save_job',{p:payload});
    if(error) throw error;
    if(JF.removed.length) sb.storage.from(BUCKET).remove(JF.removed);
    await fetchJobs(); closeModal(); showToast('Job save ho gayi.'); renderAll();
  }catch(e){
    if(uploaded.length) sb.storage.from(BUCKET).remove(uploaded);
    JF.items.forEach(it=>it.images.forEach(g=>{ if(!g.existing) delete g.path; }));
    showToast((e&&e.message)?e.message:'Save nahi hua. Internet check karein.',true);

let galGroup='party', galSearch='';
function renderGallery(){

/* ===================== INVOICES, RECEIPTS, STATEMENTS ===================== */
let INVOICES=[], SETTINGS={};
const r2=n=>Math.round((Number(n)||0)*100)/100;
function invPaid(i){return r2(PAYMENTS.filter(p=>p.invoiceId===i.id).reduce((s,p)=>s+(Number(p.amount)||0),0));}
function invDue(i){return r2(i.total-invPaid(i));}
function invState(i){
  if(i.status==='cancelled') return {l:'Cancelled',c:'gray'};
  const d=invDue(i); if(d<=0) return {l:'Paid',c:'green'};
  return invPaid(i)>0?{l:'Partial',c:'amber'}:{l:'Unpaid',c:'red'};
}
async function fetchInvoices(){
  const [ir,lr]=await Promise.all([pageAll('dieshop_invoices'),pageAll('dieshop_invoice_lines')]);
  const byInv={}; lr.sort((a,b)=>a.position-b.position).forEach(l=>{(byInv[l.invoice_id]=byInv[l.invoice_id]||[]).push({jobId:l.job_id,kind:l.kind,description:l.description,qty:l.qty,amount:Number(l.amount)||0});});
  META.invoices={};
  INVOICES=ir.map(i=>{META.invoices[i.id]={by:i.updated_by_name,at:i.updated_at};
    return {id:i.id,invoiceNo:i.invoice_no,customerId:i.party_id,date:i.invoice_date,subtotal:Number(i.subtotal)||0,discountType:i.discount_type,discountValue:Number(i.discount_value)||0,
      discountAmount:Number(i.discount_amount)||0,taxPercent:Number(i.tax_percent)||0,taxAmount:Number(i.tax_amount)||0,total:Number(i.total)||0,status:i.status,notes:i.notes,createdAt:i.created_at,lines:byInv[i.id]||[]};});
}
async function fetchSettings(){
  const {data}=await sb.from('dieshop_settings').select('*');
  SETTINGS={}; (data||[]).forEach(r=>{SETTINGS[r.key]=r.value;});
}
function calcInv(sub,type,val,tax){
  const disc=type==='percent'?r2(sub*val/100):Math.min(val,sub);
  const taxAmt=r2((sub-disc)*tax/100);
  return {disc,taxAmt,total:r2(sub-disc+taxAmt)};
}

/* ----- print / save-as-PDF documents ----- */
function printDoc(title,body){
  const w=window.open('','_blank');
  if(!w){showToast('Popup block hai. Browser mein popup allow karein.',true);return;}
  w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(title)}</title><style>
    body{font-family:Arial,Helvetica,sans-serif;color:#111;margin:0;padding:24px;font-size:13px;line-height:1.45;}
    .doc{max-width:760px;margin:0 auto;position:relative;}
    h1{font-size:22px;margin:0 0 2px;} h2{font-size:15px;margin:0;letter-spacing:.08em;}
    .top{display:flex;justify-content:space-between;gap:16px;border-bottom:2px solid #111;padding-bottom:10px;margin-bottom:14px;}
    .muted{color:#555;} .r{text-align:right;}
    table{width:100%;border-collapse:collapse;margin:12px 0;} th,td{border-bottom:1px solid #ccc;padding:7px 6px;text-align:left;vertical-align:top;} th{background:#f2f2f2;font-size:12px;}
    th.r,td.r{text-align:right;}
    .tot{margin-left:auto;width:270px;} .tot div{display:flex;justify-content:space-between;padding:4px 0;} .tot .g{font-weight:bold;font-size:15px;border-top:2px solid #111;margin-top:4px;padding-top:8px;}
    .wm{position:absolute;top:140px;left:0;right:0;text-align:center;font-size:70px;color:rgba(200,0,0,.15);transform:rotate(-18deg);font-weight:bold;pointer-events:none;}
    .foot{margin-top:26px;font-size:11px;color:#666;border-top:1px solid #ccc;padding-top:8px;}
    @media print{body{padding:0;}}
  </style></head><body><div class="doc">${body}</div><script>window.onload=function(){setTimeout(function(){window.print()},350)}<\/script></body></html>`);
  w.document.close();
}
function bizHead(label,rightHtml){
  const n=SETTINGS.business_name||'Die Shop';
  return `<div class="top"><div><h1>${esc(n)}</h1><div class="muted">${esc(SETTINGS.address||'')}${SETTINGS.phone?'<br>Phone: '+esc(SETTINGS.phone):''}${SETTINGS.gstin?'<br>GSTIN: '+esc(SETTINGS.gstin):''}</div></div><div class="r"><h2>${label}</h2>${rightHtml}</div></div>`;

async function cancelInvoice(id){
  const i=INVOICES.find(x=>x.id===id); if(!i) return;

  await Promise.all([fetchJobs(),fetchInvoices(),fetchCol('payments')]); closeModal(); renderAll(); showToast('Invoice cancel ho gayi.');

function invPartyChanged(){
  const pid=document.getElementById('f_customerId').value, c=CUSTOMERS.find(x=>x.id===pid);
  if(c){document.getElementById('f_dtype').value=c.discountType||'percent';document.getElementById('f_dvalue').value=c.discountValue||0;}
  const jobs=JOBS.filter(j=>j.customerId===pid&&!j.invoiceId&&jobTotals(j).all>0).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  document.getElementById('invJobs').innerHTML=jobs.length?jobs.map(j=>`<label class="checkline" style="padding:6px 0;"><input type="checkbox" class="invjob" value="${j.id}" checked onchange="invPreview()"><span><b>${esc(j.jobNo)}</b> · ${fmtDateShort(j.date)} · ${esc(j.status)} · ${fmtMoney(jobTotals(j).all)}</span></label>`).join(''):`<div class="empty-mini">Is party ki koi bina-bill job nahi (ya unme charges nahi hain).</div>`;

}
function invSelected(){return [...document.querySelectorAll('.invjob:checked')].map(x=>x.value);}
function invPreview(){
  const ids=invSelected(), sub=r2(JOBS.filter(j=>ids.includes(j.id)).reduce((s,j)=>s+jobTotals(j).all,0));
  const t=calcInv(sub,document.getElementById('f_dtype').value,Number(document.getElementById('f_dvalue').value)||0,Number(document.getElementById('f_tax').value)||0);
  document.getElementById('invSummary').innerHTML=`<div class="row-meta" style="flex-direction:column;gap:3px;margin:0;"><span><b>Subtotal:</b> ${fmtMoney(sub)}</span><span><b>Discount:</b> - ${fmtMoney(t.disc)}</span><span><b>Tax:</b> ${fmtMoney(t.taxAmt)}</span><span style="font-size:15px;"><b>Total: ${fmtMoney(t.total)}</b></span></div>`;
}
async function saveInvoice(){
  const pid=document.getElementById('f_customerId').value, ids=invSelected();
  if(!ids.length){showToast('Kam se kam ek job chuno.',true);return;}
  const dv=Number(document.getElementById('f_dvalue').value)||0, dt=document.getElementById('f_dtype').value, tx=Number(document.getElementById('f_tax').value)||0;
  if(dv<0||tx<0||tx>100||(dt==='percent'&&dv>100)){showToast('Discount ya tax galat hai.',true);return;}
  const btn=document.getElementById('modalSaveBtn'); btn.disabled=true; btn.textContent='Ban rahi hai…';
  try{
    const {data,error}=await sb.rpc('dieshop_create_invoice',{p:{party_id:pid,job_ids:ids,invoice_date:document.getElementById('f_date').value||todayISO(),discount_type:dt,discount_value:dv,tax_percent:tx,notes:document.getElementById('f_notes').value.trim()}});
    if(error) throw error;
    await Promise.all([fetchJobs(),fetchInvoices()]); renderAll(); showToast('Invoice ban gayi.'); openInvoiceView(data);
  }catch(e){ showToast((e&&e.message)||'Invoice nahi bani. Internet check karein.',true); }
  finally{ btn.disabled=false; btn.textContent='Save'; }
}

/* ===================== DAILY REPORTS ===================== */
let repDate=todayISO();
function dayReport(d){
  const jobs=JOBS.filter(j=>j.date===d);
  const sumItems=(arr)=>arr.reduce((a,j)=>{const t=jobTotals(j);a.dies+=j.items.reduce((s,i)=>s+(Number(i.qty)||0),0);a.design+=t.d;a.cut+=t.c;a.other+=t.o;a.total+=t.all;return a;},{dies:0,design:0,cut:0,other:0,total:0});
  const T=sumItems(jobs);
  const group=(keyFn)=>{const m={};jobs.forEach(j=>{const k=keyFn(j)||'—';(m[k]=m[k]||[]).push(j);});return Object.keys(m).sort().map(k=>({name:k,jobs:m[k].length,...sumItems(m[k])}));};
  const byParty=group(j=>partyName(j.customerId)), byOp=group(j=>j.operator);
  const delivered=JOBS.filter(j=>j.status==='Delivered'&&((META.jobs[j.id]||{}).at||'').slice(0,10)===d);
  const invs=INVOICES.filter(i=>i.date===d&&i.status==='issued');
  const billed=r2(invs.reduce((s,i)=>s+i.total,0));
  const pays=PAYMENTS.filter(p=>p.date===d);
  const collected=r2(pays.reduce((s,p)=>s+(Number(p.amount)||0),0));
  const modes={};pays.forEach(p=>{const m=p.mode||'—';modes[m]=r2((modes[m]||0)+(Number(p.amount)||0));});
  const exps=EXPENSES.filter(e=>e.date===d);
  const expTotal=r2(exps.reduce((s,e)=>s+e.amount,0));
  const pendingJobs=JOBS.filter(j=>j.status!=='Delivered');
  const pendingParties=CUSTOMERS.map(c=>({name:c.name,bal:partyBalance(c)})).filter(x=>x.bal>0.004).sort((a,b)=>b.bal-a.bal);
  return {d,jobs,T,byParty,byOp,delivered,invs,billed,pays,collected,modes,exps,expTotal,pendingJobs,pendingParties,pendingTotal:r2(pendingParties.reduce((s,x)=>s+x.bal,0))};
}
function repTable(head,rows,right){return `<table><tr>${head.map((x,i)=>`<th class="${right.includes(i)?'r':''}">${esc(x)}</th>`).join('')}</tr>${rows.length?rows.map(r=>`<tr>${r.map((x,i)=>`<td class="${right.includes(i)?'r':''}">${esc(String(x))}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${head.length}" class="muted">Kuch nahi</td></tr>`}</table>`;}
function repSections(R){
  const m=fmtMoney;
  const grpRows=(g)=>g.map(x=>[x.name,x.jobs,x.dies,m(x.design),m(x.cut),m(x.total)]);
  return [
    {t:'Summary',head:['Item','Value'],rows:[['Jobs banaye',R.jobs.length],['Dies (qty)',R.T.dies],['Designing income',m(R.T.design)],['Cutting income',m(R.T.cut)],['Other charges',m(R.T.other)],['Job value (total)',m(R.T.total)],['Delivered (status aaj badla)',R.delivered.length],['Invoices issue',R.invs.length+' · '+m(R.billed)],['Collection (payments mile)',m(R.collected)],['Expenses',m(R.expTotal)],['Collection − Expenses',m(r2(R.collected-R.expTotal))],['Pending jobs (abhi)',R.pendingJobs.length],['Party pending balance (abhi)',m(R.pendingTotal)]],right:[1]},
    {t:'Party-wise production',head:['Party','Jobs','Dies','Designing','Cutting','Total'],rows:grpRows(R.byParty),right:[1,2,3,4,5]},
    {t:'Operator-wise production',head:['Operator','Jobs','Dies','Designing','Cutting','Total'],rows:grpRows(R.byOp),right:[1,2,3,4,5]},
    {t:'Jobs',head:['Job','Party','Operator','Status','Value'],rows:R.jobs.map(j=>[j.jobNo,partyName(j.customerId),j.operator||'—',j.status,m(jobTotals(j).all)]),right:[4]},
    {t:'Invoices',head:['Invoice','Party','Total'],rows:R.invs.map(i=>[i.invoiceNo||i.id,partyName(i.customerId),m(i.total)]),right:[2]},
    {t:'Collections',head:['Party','Mode','Amount'],rows:R.pays.map(p=>[partyName(p.customerId),p.mode||'—',m(Number(p.amount)||0)]),right:[2]},
    {t:'Expenses',head:['Category','Kisko','Notes','Amount'],rows:R.exps.map(e=>[catLabel(e.category),e.paidTo||'',e.notes||'',m(e.amount)]),right:[3]},
    {t:'Pending balances (party)',head:['Party','Balance'],rows:R.pendingParties.map(x=>[x.name,m(x.bal)]),right:[1]},
    {t:'Pending production (abhi)',head:['Job','Party','Date','Status'],rows:R.pendingJobs.map(j=>[j.jobNo,partyName(j.customerId),fmtDate(j.date),j.status]),right:[]}
  ];
}
function hisabItems(R){const out=[];R.jobs.forEach(j=>j.items.forEach(it=>{out.push({jobNo:j.jobNo,party:partyName(j.customerId),design:it.designName,size:it.dieSize,qty:it.qty,price:(Number(it.designingCharge)||0)+(Number(it.cuttingCharge)||0)+(Number(it.otherCharge)||0),path:(it.images[0]||{}).path||''});}));return out;}
function hisabSummary(R){const kaam=R.T.total,mila=R.collected,kharcha=R.expTotal;return {kaam,mila,kharcha,baaki:r2(kaam-mila),bachat:r2(mila-kharcha)};}

      ${it.length?it.map(x=>`<div class="row-card" style="display:flex;gap:10px;align-items:center;">${x.path?`<img class="thumb" data-path="${esc(x.path)}" alt="">`:''}<div style="min-width:0;flex:1;"><div class="row-title">${esc(x.design)}${x.size?' · '+esc(x.size):''}</div><div class="row-sub">${esc(x.party)} · ${esc(x.jobNo)} · ${x.qty} pcs</div></div><span class="plate steel">${fmtMoney(x.price)}</span></div>`).join(''):'<div class="empty-mini">Aaj koi die nahi kati.</div>'}</div>`;})()}
    ${S.slice(1).map(s=>`<div class="card" style="margin-bottom:12px;overflow-x:auto;"><h3>${esc(s.t)}</h3><div class="rep-t">${repTable(s.head,s.rows,s.right)}</div></div>`).join('')}`;

function exportReportXlsx(){
  const R=dayReport(repDate), S=repSections(R);
  const strip=v=>typeof v==='string'?v:v;
  if(typeof XLSX==='undefined'){
    const csv='﻿'+S.map(s=>s.t+'\n'+[s.head,...s.rows].map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n')).join('\n\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='daily-report-'+repDate+'.csv';a.click();showToast('Excel library load nahi hui, CSV bani.',true);return;
  }
  const wb=XLSX.utils.book_new();
  S.forEach(s=>{const ws=XLSX.utils.aoa_to_sheet([s.head,...s.rows.map(r=>r.map(strip))]);ws['!cols']=s.head.map(()=>({wch:22}));XLSX.utils.book_append_sheet(wb,ws,s.t.replace(/[^A-Za-z0-9 -]/g,'').slice(0,31));});
  XLSX.writeFile(wb,'daily-report-'+repDate+'.xlsx');
}

const EXP_CATS=[{v:'raw_material',l:'Raw Material'},{v:'rent',l:'Rent'},{v:'electricity',l:'Electricity'},{v:'salary',l:'Employee Salary'},{v:'maintenance',l:'Maintenance'},{v:'transport',l:'Transport'},{v:'consumables',l:'Consumables'},{v:'misc',l:'Miscellaneous'}];
const PARTNERS=[{v:'aquib',l:'Aquib'},{v:'hassan',l:'Hassan'}];
const catLabel=v=>(EXP_CATS.find(c=>c.v===v)||{l:v}).l;
const partnerLabel=v=>(PARTNERS.find(c=>c.v===v)||{l:v}).l;
function basisNow(){return SETTINGS.profit_basis==='received'?'received':'billed';}
function aqPct(){const v=parseFloat(SETTINGS.aquib_pct);return isFinite(v)?v:60;}
function prevMonth(){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);return d.getFullYear()+'-'+pad2(d.getMonth()+1);}
function monthLabel(m){const [y,mm]=m.split('-');return new Date(+y,+mm-1,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'});}
async function fetchFinance(){
  const [e,c,d,cl]=await Promise.all([pageAll('dieshop_expenses'),pageAll('dieshop_capital'),pageAll('dieshop_drawings'),pageAll('dieshop_profit_closings','month')]);
  META.expenses={};META.capital={};META.drawings={};
  EXPENSES=e.map(r=>{META.expenses[r.id]={by:r.updated_by_name,at:r.updated_at};return {id:r.id,date:r.expense_date,category:r.category,amount:Number(r.amount)||0,paidTo:r.paid_to,notes:r.notes,proofPath:r.proof_path||''};});
  CAPITAL=c.map(r=>{META.capital[r.id]={by:r.updated_by_name,at:r.updated_at};return {id:r.id,date:r.entry_date,partner:r.partner,kind:r.kind,amount:Number(r.amount)||0,description:r.description};});
  DRAWINGS=d.map(r=>{META.drawings[r.id]={by:r.updated_by_name,at:r.updated_at};return {id:r.id,date:r.draw_date,partner:r.partner,amount:Number(r.amount)||0,notes:r.notes};});
  CLOSINGS=cl.map(r=>({month:r.month,status:r.status,basis:r.basis,billed:Number(r.revenue_billed)||0,received:Number(r.revenue_received)||0,revenue:Number(r.revenue_used)||0,expenses:Number(r.expenses)||0,net:Number(r.net_profit)||0,aqPct:Number(r.aquib_pct),hsPct:Number(r.hassan_pct),aqShare:Number(r.aquib_share)||0,hsShare:Number(r.hassan_share)||0,closedAt:r.closed_at,closedBy:r.closed_by_name,notes:r.notes}));
}
/* Same formulas as the database function dieshop_month_figures. */
function monthFig(m){
  const billed=r2(INVOICES.filter(i=>i.status==='issued'&&(i.date||'').startsWith(m)).reduce((s,i)=>s+i.subtotal-i.discountAmount,0));
  const received=r2(PAYMENTS.filter(p=>(p.date||'').startsWith(m)).reduce((s,p)=>s+(Number(p.amount)||0),0));
  const expenses=r2(EXPENSES.filter(e=>(e.date||'').startsWith(m)).reduce((s,e)=>s+e.amount,0));
  const revenue=basisNow()==='received'?received:billed;
  const net=r2(revenue-expenses), aq=r2(net*aqPct()/100);
  return {billed,received,expenses,revenue,net,aqShare:aq,hsShare:r2(net-aq),aqPct:aqPct(),hsPct:r2(100-aqPct())};
}
function closingFor(m){return CLOSINGS.find(c=>c.month===m&&c.status==='closed');}

async function setExpenseImg(input){

  const blob=await compressImage(f);

async function saveExpense(){
  const amount=Number(document.getElementById('f_amount').value)||0;
  if(!(amount>0)){showToast('Amount likho (0 se zyada).',true);return;}
  const btn=document.getElementById('modalSaveBtn'); btn.disabled=true; btn.textContent='Save ho raha hai…';
  let uploaded='';
  try{
    let proof=EF.img&&EF.img.existing?EF.img.path:null;
    if(EF.img&&!EF.img.existing){
      const ext=EF.img.blob.type==='image/png'?'png':EF.img.blob.type==='image/webp'?'webp':'jpg';
      uploaded='expenses/'+EF.id+'/'+crypto.randomUUID()+'.'+ext;
      const {error}=await sb.storage.from(BUCKET).upload(uploaded,EF.img.blob,{contentType:EF.img.blob.type||'image/jpeg'});
      if(error) throw error; proof=uploaded;
    }
    const row={id:EF.id,expense_date:document.getElementById('f_date').value||todayISO(),category:document.getElementById('f_cat').value,amount,paid_to:document.getElementById('f_paidto').value.trim(),notes:document.getElementById('f_notes').value.trim(),proof_path:proof};
    const {error}=await sb.from('dieshop_expenses').upsert(row,{onConflict:'id'});
    if(error) throw error;
    if(EF.oldPath&&EF.oldPath!==proof) sb.storage.from(BUCKET).remove([EF.oldPath]);
    await fetchFinance(); closeModal(); renderAll(); showToast('Expense save ho gaya.');
  }catch(e){
    if(uploaded) sb.storage.from(BUCKET).remove([uploaded]);
    showToast((e&&e.message)||'Save nahi hua. Internet check karein.',true);
  }finally{ btn.disabled=false; btn.textContent='Save'; }
}
async function deleteExpense(id){
  const e=EXPENSES.find(x=>x.id===id); if(!e) return;
  if(!confirm('Ye expense delete karein?')) return;
  const {error}=await sb.from('dieshop_expenses').delete().eq('id',id);

  if(e.proofPath) sb.storage.from(BUCKET).remove([e.proofPath]);
  await fetchFinance(); renderAll(); showToast('Expense delete ho gaya.');
}

  const drawn=DRAWINGS.filter(d=>d.partner===k).reduce((s,d)=>s+d.amount,0);
  return {cap:r2(cap),share:r2(share),drawn:r2(drawn),left:r2(share-drawn)};
}

function fmtStamp(iso){
  const d=new Date(iso); if(isNaN(d)) return '';
  return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'})+', '+d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'});
}
function addBylines(){
  document.querySelectorAll('.row-card').forEach(card=>{
    if(card.querySelector('.byline')) return;
    const btn=card.querySelector('.icon-btn[onclick^="open"]'); if(!btn) return;
    const m=/^open(\w+)Form\('([^']+)'\)/.exec(btn.getAttribute('onclick')||''); if(!m) return;
    const col=FORM_COL[m[1]]; const meta=col&&META[col][m[2]];
    if(!meta||!meta.by) return;
    const div=document.createElement('div'); div.className='byline';
    div.textContent='Entered by '+meta.by+(meta.at?' · '+fmtStamp(meta.at):'');
    card.appendChild(div);
  });
}

  if(error||!data||!data.active){
    try{ await sb.auth.signOut(); }catch(e){}
    showLogin(error?'Server se connect nahi ho paya. Dobara try karein.':'Is account ko die shop ka access nahi hai.');
    return;
  }
  ME=Object.assign({},data,{email:user.email});
  document.getElementById('userBtn').textContent=ME.display_name;
  document.body.classList.add('authed');
  if(!tabAllowed(activeTab)) activeTab='dashboard';
  document.body.classList.toggle('no-fin',!!ME&&!canFinance());
  renderTabs();
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById('sec-'+activeTab).classList.add('active');
  loadTeam();
  startData();
}
document.getElementById('loginForm').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const u=document.getElementById('lg_user').value.trim();
  const p=document.getElementById('lg_pass').value;
  if(!u||!p) return;
  const email=u.includes('@')?u:u.toLowerCase()+'@'+MAIL_DOMAIN;
  const b=document.getElementById('lg_btn'); b.disabled=true; b.textContent='Logging in…';
  const {data,error}=await sb.auth.signInWithPassword({email,password:p});
  if(error||!data.user){ showLogin(/invalid/i.test((error&&error.message)||'')?'Username ya password galat hai.':'Login nahi ho paya. Internet check karein.'); return; }
  document.getElementById('lg_pass').value='';
  enter(data.user);
});
async function init(){
  const {data}=await sb.auth.getSession();
  if(data&&data.session&&data.session.user) enter(data.session.user);
  else showLogin('');
}
init();

</script>
